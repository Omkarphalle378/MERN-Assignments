<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .container {
      margin-top: 150px;
    }

    .card {
      width: 400px;
      border-radius: 10px;
      background-color: aqua;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container d-flex justify-content-center">
    <div class="card p-3 shadow">

      <h3 class="title">Todo App</h3>

      <div class="input-group mb-3">
        <input type="text" class="form-control" id="todoInput" placeholder="Enter a todo">
        <button class="btn btn-primary" onclick="addTodo()">Add</button>
      </div>

      <div id="todoList"></div>

    </div>
  </div>

  <script>
    function addTodo() {
      let todoText = document.getElementById("todoInput").value;

      // validation
      if (todoText === "") {
        alert("Please enter a todo");
        return;
      }

      // create main todo div
      let todoDiv = document.createElement("div");
      todoDiv.className = "d-flex justify-content-between align-items-center border rounded p-2 mb-2 bg-white";

      // create text span
      let todoSpan = document.createElement("span");
      todoSpan.innerText = todoText;

      // create delete button
      let deleteBtn = document.createElement("button");
      deleteBtn.className = "btn btn-danger btn-sm";
      deleteBtn.innerText = "Delete";

      // delete functionality
      deleteBtn.onclick = function () {
        todoDiv.remove();
      };

      // assemble todo item
      todoDiv.appendChild(todoSpan);
      todoDiv.appendChild(deleteBtn);

      // add to list
      document.getElementById("todoList").appendChild(todoDiv);

      // clear input
      document.getElementById("todoInput").value = "";
    }
  </script>

</body>
</html>
