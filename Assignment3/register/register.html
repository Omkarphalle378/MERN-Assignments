<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  body{
    background-color:white;
  }

  .card{
    margin-top: 100px;
    border-radius: 10px;
  }
</style>

<script>
  function validateRegistaion(){
    let nameinput = document.getElementById("name")
    let email_address_input = document.getElementById("emailaddress")
    let password_input = document.getElementById("password")
    let phone_number_input = document.getElementById("phonenumber")

    let name = nameinput.value;
    let email = email_address_input.value;
    let password = password_input.value;
    let phone_number = phone_number_input.value;

    nameinput.classList.remove("is-valid","is-invalid")
    email_address_input.classList.remove("is-valid","is-invalid")
    password_input.classList.remove("is-valid","is-invalid")
    phone_number_input.classList.remove("is-valid","is-invalid")


    let isValid = true;
    let emailPattern =/^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    // name validation
    if (nameinput.value === "") {
      nameinput.classList.add("is-invalid");
      isValid = false;
    } 
    else{
      nameinput.classList.add("is-valid");
    }

    //email validation
    if(emailPattern.test(email)){
      email_address_input.classList.add("is-valid")
    }
    else{
      email_address_input.classList.add("is-invalid")
      isValid = false;
    }

    //password validation
    if(password.length>=6){
      password_input.classList.add("is-valid")
    }
    else{
      password_input.classList.add("is-invalid")
    }

    //phone number validation
    if (phone_number_input.value === ""){
      phone_number_input.classList.add("is-invalid");
      isValid = false;
    } 
    else{
      phone_number_input.classList.add("is-valid");
    }

    if(isValid){
      alert("Registered successfully")
    }

    return false;
  }
</script>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">

            <h3 class="text-center mb-4">Register</h3>

            <form onsubmit="return validateRegistaion()">
              <div class="mb-3">
              <label>Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter name">
              <div class="invalid-feedback">
                Please enter your name 
              </div>
            </div>

            <div class="mb-3">
              <label>Email Address</label>
              <input type="text" id="emailaddress" class="form-control" placeholder="Enter email address">
              <div class="invalid-feedback">
                please enter valid email address
              </div>
            </div>

            <div class="mb-3">
              <label>Password</label>
              <input type="password" id="password" class="form-control" placeholder="Enter password">
              <div class="invalid-feedback">
                Password must be at least 6 characters long
              </div>
            </div>

            <div class="mb-3">
              <label>Phone number</label>
              <input type="text" id="phonenumber" class="form-control" placeholder="Enter phone number">
              <div class="invalid-feedback">
                Please Enter a valid phone number
              </div>
            </div>

            <button class="btn btn-primary w-100">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
